<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="The Jores Lab Christmas Calendar.">
  <title>Jores Lab Advent Calendar</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css?v=20261109-snowfix">
  <script src="calendar.js?v=20261109-snowfix" defer></script>
</head>
<body data-weather="continuous">
  <div class="weather-layer" id="weatherLayer" aria-hidden="true"></div>
  <main class="page-shell">
    <div class="eyebrow"><span class="eyebrow-star" aria-hidden="true"></span> From the makers of PETAL and bad clonings <span class="eyebrow-star" aria-hidden="true"></span></div>
    <section class="calendar-card" aria-labelledby="pageTitle">
      <div class="card-topline" aria-hidden="true"><span></span><span class="topline-star">✦</span><span></span></div>
      <h1 id="pageTitle">The Jores Lab<br><em>Advent Calendar</em></h1>
      <p class="subtitle" id="subtitleText" aria-live="polite"></p>
      <div class="date-row">
        <span class="date-rule" aria-hidden="true"></span>
        <p class="date" id="dateText"></p>
        <span class="date-rule" aria-hidden="true"></span>
      </div>

      <div class="day-display">
        <div class="day-seal" aria-hidden="true"><span id="dayNumber">—</span></div>
        <p class="name-label">Today’s name</p>
        <p class="name" id="nameText" aria-live="polite"></p>
        <p class="notice" id="noticeText" aria-live="polite"></p>
      </div>

      <div class="actions">
        <button class="button button-primary" id="snowButton" type="button"><span aria-hidden="true">✦</span> Stop snow</button>
        <button class="button button-secondary" id="prevDayButton" type="button"><span aria-hidden="true">←</span> Previous day</button>
      </div>
      <p class="helper">Missed a day? Step back to see who had the Türchen.</p>
    </section>

  </main>
</body>
</html>
